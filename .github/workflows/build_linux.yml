name: Build Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Spawn version"
        required: true
        default: "1.0.0"

jobs:
  build:
    name: Linux x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender1

      - name: Set version
        run: |
          echo "__version__ = '${{ inputs.version }}'" > core/version.py

      - name: Install wxPython
        run: |
          python -m pip install --upgrade pip
          python -m pip install "https://github.com/wxWidgets/Phoenix/releases/download/wxPython-4.2.5/wxpython-4.2.5+ubuntu2404-cp311-cp311-linux_x86_64.whl"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install zstandard
          python -m pip install nuitka

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --include-data-dir=assets=assets \
            --assume-yes-for-downloads \
            --output-filename=Spawn \
            --plugin-enable=pthreads \
            --output-dir=dist \
            --include-package=wx \
            main.py

      - name: Make executable
        run: |
          chmod +x dist/Spawn

      - name: Create archive
        run: |
          tar -czf "Spawn_${{ inputs.version }}_Linux_x64.tar.gz" \
            -C dist Spawn

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Spawn_${{ inputs.version }}_Linux_x64
          path: Spawn_${{ inputs.version }}_Linux_x64.tar.gz
          if-no-files-found: error
