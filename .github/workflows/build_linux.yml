name: Build Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Spawn version"
        required: true
        default: "1.0.0"

jobs:
  build:
    name: Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender1

      - name: Set version
        run: |
          echo "__version__ = '${{ inputs.version }}'" > core/version.py

      - name: Install wxPython
        run: |
          python -m pip install --upgrade pip
          python -m pip install "https://github.com/wxWidgets/Phoenix/releases/download/wxPython-4.2.5/wxpython-4.2.5+ubuntu2204-cp311-cp311-linux_x86_64.whl"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install zstandard
          python -m pip install nuitka

      - name: Build
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --include-data-dir=assets=assets \
            --assume-yes-for-downloads \
            --output-filename=Spawn \
            --report=report.xml \
            --output-dir=dist \
            --include-package=wx \
            main.py

      - name: Convert application icon
        run: |
         python -m pip install Pillow
         python -c "from PIL import Image; Image.open('assets/spawn.ico').convert('RGBA').resize((256, 256), Image.Resampling.LANCZOS).save('assets/spawn.png')"

      - name: Create .deb package
        run: |
          VERSION="${{ inputs.version }}"
          PACKAGE="spawn-${VERSION}-amd64"

          mkdir -p "${PACKAGE}/DEBIAN"
          mkdir -p "${PACKAGE}/usr/bin"
          mkdir -p "${PACKAGE}/usr/share/applications"
          mkdir -p "${PACKAGE}/usr/share/icons/hicolor/256x256/apps"

          cp dist/Spawn "${PACKAGE}/usr/bin/spawn"
          chmod 755 "${PACKAGE}/usr/bin/spawn"

          cp assets/spawn.png "${PACKAGE}/usr/share/icons/hicolor/256x256/apps/spawn.png"

          cat > "${PACKAGE}/usr/share/applications/spawn.desktop" <<EOF
          [Desktop Entry]
          Name=Spawn
          Comment=IDE for open.mp and SA-MP development
          Exec=spawn
          Icon=spawn
          Terminal=false
          Type=Application
          Categories=Development;IDE;
          EOF

          cat > "${PACKAGE}/DEBIAN/control" <<EOF
          Package: spawn
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Spawn IDE
          Description: IDE for open.mp and SA-MP development
          EOF

          dpkg-deb --build --root-owner-group "${PACKAGE}" \
            "Spawn_${VERSION}_Linux_amd64.deb"

      - name: Create archive
        run: |
          tar -czf "Spawn_${{ inputs.version }}_Linux_x64.tar.gz" \
            -C dist Spawn

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Spawn_${{ inputs.version }}_Linux_x64
          path: |
            Spawn_${{ inputs.version }}_Linux_x64.tar.gz
            Spawn_${{ inputs.version }}_Linux_amd64.deb
          if-no-files-found: error
